name: Lint Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint & Unused Imports Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code 🛎
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm 🌟
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies 📦
        run: pnpm install --frozen-lockfile

      - name: Run ESLint with unused imports check 🔍
        run: |
          echo "Running ESLint to check for unused imports and variables..."
          pnpm lint
        env:
          CI: true

      - name: Check for formatting issues 📝
        run: |
          echo "Checking code formatting..."
          pnpm check:format

      - name: Report results 📊
        if: failure()
        run: |
          echo "❌ Linting or formatting issues found!"
          echo "Please run 'pnpm lint --fix' and 'pnpm format' to fix these issues."
          echo "Then commit and push the changes."
          exit 1